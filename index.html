<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Børnenes Skema</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:20px;
    background:#f4f4f4;
}

h1,h2,h3{
    text-align:center;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:15px;
    max-width:500px;
    margin:auto;
}

.barn{
    padding:20px;
    border-radius:12px;
    color:black;
    font-size:28px;
    font-weight:bold;
    text-align:center;
    cursor:pointer;
}

.luna{
    background:#FFD84D;
}

.ene{
    background:#FFB6D9;
}

.manfred{
    background:#FF6B6B;
}

.skjult{
    display:none;
}

.sektion{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:12px;
}

label{
    display:block;
    margin:8px 0;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:8px;
    background:#333;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="forside">

<h1>Børnenes Skema</h1>

<div class="menu">

<div class="barn luna" onclick="visBarn('luna')">
🌙 LUNA
</div>

<div class="barn ene" onclick="visBarn('ene')">
🦄 ENE
</div>

<div class="barn manfred" onclick="visBarn('manfred')">
🦖 MANFRED
</div>

</div>

</div>

<div id="barnSide" class="skjult">

<button onclick="tilbage()">← Tilbage</button>

<h2 id="barnNavn"></h2>

<div id="indhold"></div>

</div>

<script>

const weekend =
new Date().getDay() === 0 ||
new Date().getDay() === 6;

const opgaver = {

luna: {

navn:"🌙 LUNA",

morgen:[
"🚽 Toilet",
"👕 Nattøj til vask",
"👖 Tøj på",
"🥣 Morgenmad",
"🍽️ Skål i opvasker",
"💇 Rede hår",
"💎 Rense øreringe",
"🦷 Børste tænder",
"🎒 Pakke tasker",
"🧥 Sko og jakke på"
],

eftermiddag:[
"👟 Sko og jakke på plads",
"🍱 Madkasser i køkken",
"📄 Papir fra tasken i papirbakken",
"🎒 Taske på plads",
"🧼 Vaske hænder"
],

aften:[
"🧸 Rydde op inden aftensmad",
"🧼🚽 Vaske hænder og tisse inden aftensmad",
"🍽️ Tøm bordet efter aftensmad",
"👕 Tøj til vask",
"🌙 Nattøj på",
"💇 Rede hår",
"💎 Rense øreringe",
"🦷 Børste tænder",
"📖 Læse bog",
"✏️ Lave lektier"
]

},

ene: {

navn:"🦄 ENE",

morgen:[
"🚽 Toilet",
"👕 Nattøj til vask",
"👖 Tøj på",
"🥣 Morgenmad",
"🍽️ Skål i opvasker",
"💇 Rede hår",
"🦷 Børste tænder",
"🎒 Pakke tasker",
"🧥 Sko og jakke på"
],

eftermiddag:[
"👟 Sko og jakke på plads",
"🍱 Madkasser i køkken",
"📄 Papir fra tasken i papirbakken",
"🎒 Taske på plads",
"🧼 Vaske hænder"
],

aften:[
"🧸 Rydde op inden aftensmad",
"🧼🚽 Vaske hænder og tisse inden aftensmad",
"🍽️ Tøm bordet efter aftensmad",
"👕 Tøj til vask",
"🌙 Nattøj på",
"💇 Rede hår",
"🦷 Børste tænder",
"📖 Læse bog",
"✏️ Lave lektier"
]

},

manfred: {

navn:"🦖 MANFRED",

morgen:[
"🚽 Toilet",
"👕 Nattøj til vask",
"👖 Tøj på",
"🥣 Morgenmad",
"🍽️ Skål i opvasker",
"🦷 Børste tænder",
"🎒 Pakke tasker",
"🧥 Sko og jakke på"
],

eftermiddag:[
"👟 Sko og jakke på plads",
"🍱 Madkasser i køkken",
"📄 Papir fra tasken i papirbakken",
"🎒 Taske på plads",
"🏃 Idrætstaske tømmes",
"🧼 Vaske hænder",
"📚 Tjekke om der er lektier"
],

aften:[
"🧸 Rydde op inden aftensmad",
"🧼🚽 Vaske hænder og tisse inden aftensmad",
"🍽️ Tøm bordet efter aftensmad",
"👕 Tøj til vask",
"🌙 Nattøj på",
"🦷 Børste tænder",
"📖 Læse bog",
"✏️ Lave lektier"
]

}

};


function visBarn(barn){

document.getElementById("forside").classList.add("skjult");
document.getElementById("barnSide").classList.remove("skjult");

document.getElementById("barnNavn").innerText =
opgaver[barn].navn;

let html = "";

html += lavSektion("Morgen", opgaver[barn].morgen, barn+"_morgen");

if(!weekend){
html += lavSektion("Eftermiddag", opgaver[barn].eftermiddag, barn+"_eftermiddag");
}

html += lavSektion("Aften", opgaver[barn].aften, barn+"_aften");

document.getElementById("indhold").innerHTML = html;
}

function lavSektion(titel,liste,prefix){

let html = '<div class="sektion">';
html += '<h3>'+titel+'</h3>';

liste.forEach((tekst,index)=>{

const key = prefix+"_"+index;
const checked =
localStorage.getItem(key)==="true";

html += `
<label>
<input
type="checkbox"
${checked ? "checked" : ""}
onchange="gem('${key}', this.checked)">
${tekst}
</label>
`;

});

html += '</div>';

return html;
}

function gem(key,value){
localStorage.setItem(key,value);
}

function tilbage(){
document.getElementById("barnSide").classList.add("skjult");
document.getElementById("forside").classList.remove("skjult");
}

</script>

</body>
</html>
