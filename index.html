<!DOCTYPE html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FamilieRutiner V1</title><style>body{font-family:Arial;margin:0;background:#f4f4f4}header{text-align:center;padding:15px}.kids{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.card{width:220px;padding:18px;border-radius:18px;text-align:center;font-weight:bold;cursor:pointer}.yellow{background:#f5d34f}.pink{background:#f7b2d9}.red{background:#ff6b6b}.screen{padding:15px}.hidden{display:none}.task{background:#fff;margin:6px 0;padding:10px;border-radius:10px}.btn{padding:10px 14px;border:none;border-radius:10px;background:#333;color:#fff}.tree{font-size:54px;text-align:center}.avatar{font-size:48px}.section{background:#eaeaea;padding:8px;margin-top:10px;border-radius:10px}</style></head><body><div id="home"><header><h1>Familierutiner</h1><div class="tree" id="tree">🌱</div><div>Familiepoint: <span id="familyPoints">0</span></div></header><div class="kids"><div class="card yellow" onclick="openChild('luna')"><div class='avatar' id='av-luna'>🌙</div>LUNA<br>⭐ <span id='star-luna'>0</span></div><div class="card pink" onclick="openChild('ene')"><div class='avatar' id='av-ene'>🦄</div>ENE<br>⭐ <span id='star-ene'>0</span></div><div class="card red" onclick="openChild('manfred')"><div class='avatar' id='av-manfred'>🦖</div>MANFRED<br>⭐ <span id='star-manfred'>0</span></div></div></div><div id='child' class='hidden screen'><button class='btn' onclick='backHome()'>Tilbage</button><h2 id='childTitle'></h2><div id='taskArea'></div><h3>Vælg avatar</h3><select id='avatarSelect' onchange='saveAvatar()'><option>🌙</option><option>🦄</option><option>🦖</option><option>🐱</option><option>🐶</option><option>🐰</option><option>🦊</option><option>🐉</option><option>🤖</option><option>🚀</option><option>⭐</option><option>🌈</option><option>🌻</option></select></div><script>
const kids={luna:{name:'LUNA',avatar:'🌙',hair:true,ear:true},ene:{name:'ENE',avatar:'🦄',hair:true,ear:false},manfred:{name:'MANFRED',avatar:'🦖',hair:false,ear:false}};
let current='';let db=JSON.parse(localStorage.getItem('famv1')||'{}');
function save(){localStorage.setItem('famv1',JSON.stringify(db));updateHome();}
function obj(k){if(!db[k]) db[k]={stars:0}; return db[k];}
function tasks(id){let w=(new Date().getDay()==0||new Date().getDay()==6); let k=kids[id]; let m=['Toilet','Nattøj til vask','Tøj på','Morgenmad','Skål i opvasker']; if(k.hair)m.push('Rede hår'); if(k.ear)m.push('Rense øreringe'); m.push('Børste tænder','Pakke tasker','Sko og jakke på'); let e=['Sko og jakke på plads','Vaske hænder']; if(!w){e.push('Madkasser i køkken','Papir i papirbakken','Taske på plads'); if(id=='manfred')e.push('Idrætstaske tømmes','Tjekke lektier');} let a=['Rydde op inden aftensmad','Vaske hænder og tisse','Tøm bordet','Tøj til vask','Nattøj på']; if(k.hair)a.push('Rede hår'); if(k.ear)a.push('Rense øreringe'); a.push('Børste tænder','Læse bog','Lave lektier'); return {Morgen:m,Eftermiddag:e,Aften:a};}
function openChild(id){current=id;document.getElementById('home').classList.add('hidden');document.getElementById('child').classList.remove('hidden');document.getElementById('childTitle').innerText=kids[id].avatar+' '+kids[id].name;document.getElementById('avatarSelect').value=(obj(id).avatar||kids[id].avatar);let html=''; let ts=tasks(id); for(let sec in ts){html+='<div class=section><h3>'+sec+'</h3>'; ts[sec].forEach((t,i)=>{let key=id+sec+i;let c=db[key]?'checked':'';html+='<div class=task><label><input type=checkbox '+c+' onchange="toggle(''+key+'')"> '+t+'</label></div>';}); html+='</div>';} html+='<button class=btn onclick="finishDay()">Dagen færdig ⭐</button>'; document.getElementById('taskArea').innerHTML=html; }
function toggle(k){db[k]=!db[k]; save();}
function finishDay(){obj(current).stars=(obj(current).stars||0)+1; alert('Flot klaret!'); save();}
function saveAvatar(){obj(current).avatar=document.getElementById('avatarSelect').value;save();}
function backHome(){document.getElementById('child').classList.add('hidden');document.getElementById('home').classList.remove('hidden');}
function updateHome(){let pts=0; ['luna','ene','manfred'].forEach(id=>{let d=obj(id); document.getElementById('star-'+id).innerText=d.stars||0; document.getElementById('av-'+id).innerText=d.avatar||kids[id].avatar; pts+=(d.stars||0);}); document.getElementById('familyPoints').innerText=pts; document.getElementById('tree').innerText=pts<25?'🌱':pts<50?'🌿':pts<100?'🌳':'🌳🌸';}
updateHome();
</script></body></html>
