<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FamilieRutiner</title><style>body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:20px}h1{text-align:center}.tree{font-size:48px;text-align:center}.kids{display:flex;gap:15px;flex-wrap:wrap;justify-content:center}.card{padding:20px;border-radius:16px;color:#222;width:220px;cursor:pointer;text-align:center;font-weight:bold}.screen{display:none}.active{display:block}.task{background:white;margin:6px 0;padding:8px;border-radius:8px}.btn{padding:10px 16px;border:none;border-radius:8px;background:#333;color:white;cursor:pointer}</style></head><body><div id="home" class="active"><h1>Familierutiner</h1><div class="tree" id="tree">🌱</div><p style="text-align:center">Familiepoint: <span id="points">0</span></p><div class="kids"><div class="card" style="background:#FFD54A" onclick="openChild('LUNA')">🌙<br>LUNA<br>⭐ <span id='sLUNA'>0</span></div><div class="card" style="background:#FFB6D9" onclick="openChild('ENE')">🦄<br>ENE<br>⭐ <span id='sENE'>0</span></div><div class="card" style="background:#FF6A6A" onclick="openChild('MANFRED')">🦖<br>MANFRED<br>⭐ <span id='sMANFRED'>0</span></div></div></div><div id="child" class="screen"><button class="btn" onclick="goHome()">Tilbage</button><h2 id="childName"></h2><div id="tasks"></div></div><script>const tasks={morgen:['Toilet','Nattøj til vask','Tøj på','Morgenmad','Skål i opvasker','Børste tænder','Sko og jakke på'],eftermiddag:['Sko og jakke på plads','Vaske hænder'],aften:['Rydde op','Tøj til vask','Nattøj på','Børste tænder','Læse bog']};let data=JSON.parse(localStorage.getItem('familieapp')||'{}');function save(){localStorage.setItem('familieapp',JSON.stringify(data));update();}function update(){let pts=0;['LUNA','ENE','MANFRED'].forEach(n=>{let s=data[n]?.stars||0;document.getElementById('s'+n).textContent=s;pts+=s;});document.getElementById('points').textContent=pts;document.getElementById('tree').textContent=pts<25?'🌱':pts<50?'🌿':pts<100?'🌳':'🌳🌸';}function openChild(name){document.getElementById('home').className='screen';document.getElementById('child').className='active';document.getElementById('childName').textContent=name;let html='';Object.entries(tasks).forEach(([p,list])=>{html+='<h3>'+p.toUpperCase()+'</h3>';list.forEach((t,i)=>{const key=name+p+i;const checked=data[key]?'checked':'';html+='<div class="task"><input type="checkbox" '+checked+' onchange="toggle(''+key+'')"> '+t+'</div>';});});html+='<button class="btn" onclick="completeDay(''+name+'')">Dagen færdig</button>';document.getElementById('tasks').innerHTML=html;}function toggle(k){data[k]=!data[k];save();}function completeDay(name){data[name]=data[name]||{stars:0};data[name].stars+=1;alert('Flot klaret! ⭐');save();}function goHome(){document.getElementById('child').className='screen';document.getElementById('home').className='active';update();}update();</script></body></html>
